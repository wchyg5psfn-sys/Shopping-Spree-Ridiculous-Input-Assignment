<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShoppingSpree</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="purchasepage.css">
</head>

<body>

<!-- HEADER -->
<header>
  <div class="logo">
    <h1>ShoppingSpree</h1>
    <p>Shop till you drop!</p>
  </div>

  <nav class="nav">
    <a href="#">All Products</a>
    <a href="#">Tops</a>
    <a href="#">Bottoms</a>
    <a href="#">Accessories</a>
  </nav>
</header>

<!-- BRANDS -->
<section class="brands">
  <p>H&amp;W, OATS AND FORTS, PSYCHO B, ZERA, BANANA REPUBLIC</p>
</section>

<!-- PRODUCT PAGE -->
<section class="product-page">
  <img src="clothing.jpg" alt="Grey Ribbon Shirt">

  <div class="product-info">
    <h1>Grey Ribbon Shirt</h1>
    <p>T-Shirt</p>
    <h2 style="font-family: 'Roboto Mono', monospace;">$27.00</h2>

    <div class="sizes">
      <button class="size">XS</button>
      <button class="size">S</button>
    </div>

    <div class="sizes">
      <button class="size">M</button>
      <button class="size">L</button>
    </div>

    <div class="quantity" style="text-align: center;">
      <button id="remove">−</button>
      <span id="count">0</span>
      <button id="add">+</button>
    </div>

    <button class="checkout" id="checkout">Checkout</button>
  </div>
</section>

<!-- MODAL -->
<div class="modal" id="payment-modal">
  <div class="modal-content">
    <h2>Payment</h2>
    <p>Items: <span id="modal-items">0</span></p>
    <p>Total: $<span id="modal-price">0.00</span></p>
    <button onclick="payNow()">Pay Now</button>
    <button onclick="closeModal()">Close</button>
  </div>
</div>

<script>
  // Size selection
const sizeButtons = document.querySelectorAll(".size");

sizeButtons.forEach(button => {
  button.addEventListener("click", () => {
    // remove active from all
    sizeButtons.forEach(btn => btn.classList.remove("active"));
    // add active to clicked
    button.classList.add("active");
  });
});
let count = 0;
const price = 27;

const countEl = document.getElementById("count");
const modal = document.getElementById("payment-modal");
const modalItems = document.getElementById("modal-items");
const modalPrice = document.getElementById("modal-price");

document.getElementById("add").onclick = () => {
  count += 99;
  countEl.textContent = count;
};

document.getElementById("remove").onclick = () => {
  count += 1;
  countEl.textContent = count;
};

document.getElementById("checkout").onclick = () => {
  if (count === 0) return;
  modalItems.textContent = count;
  modalPrice.textContent = (count * price).toFixed(2);
  modal.style.display = "flex";
};

function closeModal() {
  modal.style.display = "none";
}

function payNow() {
  alert("Payment successful!");
  count = 0;
  countEl.textContent = 0;
  closeModal();
}
</script>

</body>
</html>
