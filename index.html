<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>ShoppingSpree</title>

  <!-- Font -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shoppingspree.css">
</head>

<body>

<header class="header">
  <div>
    <div style="font-size:64px;">ShoppingSpree</div>
    <div style="font-size:15px;">Shop till you drop!</div>
  </div>

  <nav class="nav">
    <a href="#all-products">All Products</a>
    <a href="#tops">Tops</a>
    <a href="#">Bottoms</a>
    <a href="#">Accessories</a>
  </nav>
</header>

<!-- HERO VIDEO -->
<section class="hero-video">
  <video autoplay muted loop playsinline>
    <source src="6565790-uhd_2160_3840_24fps.mp4" type="video/mp4">
  </video>
  <div class="hero-overlay">
    <button class="shop-now">Shop Now</button>
  </div>
</section>

<!-- BRAND STRIP -->
<section class="brand-strip">
  H&W, OATS AND FORTS, PSYCHO B, ZERA, BANANA REAPUBLIC
</section>

<!-- PRODUCTS -->
<section id="all-products" class="products">
  <h2 class="section-title">Popular items</h2>

  <div class="filters">
    <b>filters</b>
    <span class="filter-pill">Girls</span>
    <span class="filter-pill">Woman</span>
    <span class="filter-pill">Casual</span>
  </div>

  <div class="product-grid">
    <div class="product-card">
      <img src="cute shirts.jpg" alt="Teen girl blue">
      <div class="product-info">
        <div>
          <div>Teen girl blue</div>
          <div style="color:#B9B9B9;">T-shirt</div>
        </div>
        <div class="actions">
          <span class="size">S</span>
          <span class="plus">+</span>
        </div>
      </div>
    </div>

    <div class="product-card">
      <img src="clothing.jpg" alt="Grey Ribbon Shirt">
      <div class="product-info">
        <div>
          <a href="purchasepage.html" style="text-decoration:none; color:inherit;">
            <div>Grey Ribbon Shirt</div>
          </a>
          <div style="color:#B9B9B9;">T-shirt</div>
        </div>
        <div class="actions">
          <span class="size">S</span>
          <span class="plus">+</span>
        </div>
      </div>
    </div>

    <div class="product-card">
      <img src="grey sweater.jpg" alt="Casual girl time">
      <div class="product-info">
        <div>
          <div>Casual girl time</div>
          <div style="color:#B9B9B9;">Sweater</div>
        </div>
        <div class="actions">
          <span class="size">S</span>
          <span class="plus">+</span>
        </div>
      </div>
    </div>
  </div>
</section>

</body>
</html>
